<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="robots" content="noindex">
<meta name="description" content="Sly Weather experiment: one timeline for the coming hours and the week, with the rain map and the forecast for any moment you touch.">
<meta name="version" content="test-5">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">
<title>Sly Weather test: tijdlijn</title>
<!--
  Sly Weather test page: a Sly Solutions experiment (https://slysolutions.nl/weather/test/)
  One timeline (hours and week) with the rain map and the written forecast for the moment under your finger.
  Reads the place saved by the main app (same origin, localStorage). Three requests: Open-Meteo for the place,
  Open-Meteo for a fixed grid over the Netherlands (identical for everyone), and the Buienradar image.
-->
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(data:font/woff2;base64,{{FONT_MANROPE}}) format("woff2")}
@font-face{font-family:"Space Mono";font-style:normal;font-weight:400;font-display:swap;src:url(data:font/woff2;base64,{{FONT_MONO400}}) format("woff2")}
@font-face{font-family:"Space Mono";font-style:normal;font-weight:700;font-display:swap;src:url(data:font/woff2;base64,{{FONT_MONO700}}) format("woff2")}
:root{
  --bg:#F4F5F7; --bg-2:#FFFFFF; --bg-3:#E9EBEF;
  --text:#22282F; --text-2:#5A6470; --line:#D7DBE1;
  --accent:#F68712; --accent-ink:#B85E00; --accent-soft:#FDEBD8;
  --focus:#1F6FEB;
  --rain-1:#BFE3FF; --rain-2:#5FB4F2; --rain-3:#1F6FEB; --rain-4:#8B3FD9; --rain-5:#D23B6B;
  --temp:#E0702A; --temp-cold:#2F7FD6; --wind:#2E8B57;
  --map-land:#E3E6EA; --map-prov:#8A939E; --map-sea:#F4F5F7;
  --night:rgba(34,40,47,.17); --day:rgba(246,135,18,.06);
  --radius:14px;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,25,30,.06),0 10px 30px -18px rgba(20,25,30,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="nerd"]){
    --bg:#14171B; --bg-2:#1C2026; --bg-3:#242930; --text:#E7E9EC; --text-2:#A6AEB8; --line:#30363E;
    --accent:#F68712; --accent-ink:#FFB066; --accent-soft:#3A2A18;
    --rain-1:#3B7DB8; --rain-2:#5FB4F2; --rain-3:#9CD3FF; --rain-4:#C79BFF; --rain-5:#FF7AA2;
    --temp:#FFB066; --temp-cold:#7FB6FF; --wind:#5BD08A;
    --map-land:#2A3038; --map-prov:#6B7684; --map-sea:#14171B; --night:rgba(0,0,0,.5); --day:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171B; --bg-2:#1C2026; --bg-3:#242930; --text:#E7E9EC; --text-2:#A6AEB8; --line:#30363E;
  --accent:#F68712; --accent-ink:#FFB066; --accent-soft:#3A2A18;
  --rain-1:#3B7DB8; --rain-2:#5FB4F2; --rain-3:#9CD3FF; --rain-4:#C79BFF; --rain-5:#FF7AA2;
  --temp:#FFB066; --temp-cold:#7FB6FF; --wind:#5BD08A;
  --map-land:#2A3038; --map-prov:#6B7684; --map-sea:#14171B; --night:rgba(0,0,0,.5); --day:rgba(255,255,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark;
}
:root[data-theme="nerd"]{
  --bg:#0A0E0C; --bg-2:#0F1512; --bg-3:#152019; --text:#9FE8A8; --text-2:#5FAA6A; --line:#1F3A27;
  --accent:#F68712; --accent-ink:#FFB066; --accent-soft:#1E2A14;
  --rain-1:#2F6B4A; --rain-2:#3FA66A; --rain-3:#5BF07A; --rain-4:#C8FF5B; --rain-5:#F68712;
  --temp:#F68712; --temp-cold:#5FB4F2; --wind:#9FE8A8;
  --map-land:#101A14; --map-prov:#5FAA6A; --map-sea:#0A0E0C; --night:rgba(0,0,0,.55); --day:rgba(159,232,168,.06);
  --font-body:var(--font-mono); --radius:2px; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent-ink)}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-bottom:1px solid var(--line)}
header.top .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:.9rem;white-space:nowrap}
header.top .back svg{width:20px;height:20px}
header.top .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
header.top .tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:999px}
.iconbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--text-2)}
.iconbtn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
:root[data-theme="nerd"] .iconbtn,:root[data-theme="nerd"] .tag,:root[data-theme="nerd"] .zoom button{border-radius:2px}
.app{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
:root[data-theme="nerd"] .card{border-color:var(--text-2)}
.status{font-size:.82rem;color:var(--text-2);margin:0 2px 10px}
.status.err{color:#D23B6B}
/* Welke delen de pagina toont: eerste keer alles, daarna de keuze (op dit toestel bewaard) */
.menu{position:absolute;right:12px;top:calc(100% + 6px);max-width:calc(100% - 24px);background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;z-index:31}
:root[data-theme="nerd"] .menu{border-color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0;font-size:.78rem;color:var(--text-2)}
.chips button{border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);font:inherit;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
:root[data-theme="nerd"] .chips button{border-radius:2px}
/* Uitlezing van het gekozen moment */
.readout .when{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--text-2)}
.readout .when b{color:var(--text);font-size:1.05rem}
.readout .src{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--bg-3)}
.readout .src.radar{background:var(--accent-soft);color:var(--accent-ink)}
.readout .big{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.readout .big .ico{font-size:2rem;line-height:1}
.readout .big .temp{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.readout .big .txt{font-weight:600}
.readout .kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--text-2)}
.readout .kv b{color:var(--text);font-weight:700}
/* Tijdlijn */
.tlhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tlhead h2{font-size:.95rem;margin:0;flex:1;min-width:0}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.zoom button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:.82rem;font-weight:700;padding:4px 8px;cursor:pointer}
.zoom button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
canvas#tl{display:block;width:100%;height:216px;touch-action:pan-y;cursor:crosshair;border-radius:8px}
.hint{font-size:.78rem;color:var(--text-2);margin:6px 0 0}
/* Kaart */
.mapwrap{position:relative}
canvas#map{display:block;width:100%;height:auto;border-radius:10px;background:var(--map-sea)}
/* Zoomknoppen op de kaart: 1x heel Nederland, 2x en 4x rond je plek */
.mapzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapzoom button{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font:inherit;font-size:1.1rem;font-weight:700;line-height:1;cursor:pointer;padding:0}
.mapzoom button:disabled{opacity:.4;cursor:default}
:root[data-theme="nerd"] .mapzoom button{border-radius:2px}
.maplbl{position:absolute;left:10px;top:10px;font-size:.78rem;font-weight:700;background:var(--bg-2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.74rem;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* Legenda tijdlijn: lijn, stippellijn, band, staaf, streep en stip */
.legend .ln{display:inline-block;width:16px;height:0;border-top:2px solid var(--temp);vertical-align:middle;margin-right:4px}
.legend .ln.wind{border-top:2px dashed var(--wind)}
.legend .band{display:inline-block;width:16px;height:7px;vertical-align:middle;margin-right:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--text-2) 10%,transparent),color-mix(in srgb,var(--text-2) 70%,transparent))}
.legend .bar{display:inline-block;width:6px;height:12px;vertical-align:-2px;margin-right:4px;background:var(--rain-3)}
.legend .now{display:inline-block;width:2px;height:12px;vertical-align:-2px;margin-right:4px;background:#D23B6B}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:999px;vertical-align:0;margin-right:4px;background:var(--temp)}
.legend .dot.lo{background:var(--temp-cold)}
/* Tekst */
.story p{margin:0 0 8px}
.story p:last-child{margin:0}
.explain{font-size:.85rem;color:var(--text-2)}
.explain h2{font-size:.95rem;color:var(--text);margin:0 0 6px}
.explain ul{margin:6px 0 0;padding-left:18px}
.explain code{font-family:var(--font-mono);font-size:.8em}
.explain li{overflow-wrap:anywhere}
.empty{text-align:center;padding:30px 10px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font:inherit;font-weight:700;padding:8px 14px;border-radius:999px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1B1208}
:root[data-theme="nerd"] .btn{border-radius:2px}:root[data-theme="nerd"] .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
footer.foot{font-size:.78rem;color:var(--text-2);text-align:center;margin-top:18px}
footer.foot svg{width:22px;height:22px;vertical-align:middle;margin-right:4px}
@media (min-width:900px){
  .grid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:12px;align-items:start}
  canvas#tl{height:230px}
}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Sly Weather</span></a>
  <div class="name" id="placename"></div>
  <span class="tag" id="tag">test</span>
  <button class="iconbtn" id="menubtn" type="button" aria-label="Toon" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="iconbtn" id="refresh" type="button" aria-label="Vernieuwen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
  <div class="menu" id="menu" hidden><div class="chips" id="chips"></div></div>
</header>
<main class="app">
  <p class="status" id="status"></p>
  <div id="empty" class="card empty" hidden>
    <p id="emptytxt"></p>
    <a class="btn primary" href="../" id="emptybtn"></a>
  </div>
  <div id="content" hidden>
    <section class="card readout" id="readout">
      <div class="when"><b id="r-day"></b><span id="r-time"></span><span class="src" id="r-src"></span></div>
      <div class="big"><span class="ico" id="r-ico"></span><span class="temp" id="r-temp"></span><span class="txt" id="r-txt"></span></div>
      <div class="kv" id="r-kv"></div>
    </section>
    <section class="card" id="tlcard">
      <div class="tlhead"><h2 id="tltitle"></h2><button class="btn" id="nowbtn" type="button" style="padding:3px 10px;font-size:.82rem"></button><div class="zoom" id="zoom"><button type="button" data-z="3">3 u</button><button type="button" data-z="12">12 u</button><button type="button" data-z="24">24 u</button><button type="button" data-z="72">3 d</button><button type="button" data-z="168">7 d</button></div></div>
      <canvas id="tl" aria-label="Tijdlijn" role="img"></canvas>
      <div class="legend" id="tllegend"></div>
    </section>
    <div class="grid">
      <section class="card" id="mapcard">
        <div class="mapwrap"><canvas id="map" role="img" aria-label="Neerslagkaart"></canvas><div class="maplbl" id="maplbl"></div><div class="mapzoom"><button type="button" id="mzin" aria-label="+">+</button><button type="button" id="mzout" aria-label="-">−</button></div></div>
        <div class="legend" id="legend"></div>
      </section>
      <div>
        <section class="card story" id="story"></section>
        <section class="card explain" id="explain"></section>
      </div>
    </div>
  </div>
  <footer class="foot">{{BRAND_SVG_SMALL}}<span id="foot"></span></footer>
</main>

    const v = h.temperature_2m[k], kx = x(h0 + k * 3600000), ky = yT(v), txt = Math.round(v) + '°', tw = g.measureText(txt).width;
    const lx = Math.max(2 + tw / 2, Math.min(W - 2 - tw / 2, kx)), ly = p.night ? ky + 16 : ky - 7, box = {x: lx - tw / 2 - 2, y: ly - 11, w: tw + 4, h: 13};

    g.lineWidth = 3; g.strokeStyle = col('--bg-2'); g.lineJoin = 'round'; g.strokeText(txt, lx, ly); g.fillText(txt, lx, ly);

  const sx = x(sel); g.strokeStyle = col('--accent'); g.lineWidth = 2; g.beginPath(); g.moveTo(sx, top - 4); g.lineTo(sx, bottom + 2); g.stroke();
  const lbl = (zoomH > 24 ? dayName(sel, true) + ' ' : '') + clock(sel); g.font = (nerd ? 'bold 11px ' + col('--font-mono') : '800 11px ' + col('--font-body'));
  const tw = g.measureText(lbl).width + 10, lx = Math.max(2, Math.min(W - tw - 2, sx - tw / 2));
  g.fillStyle = col('--accent'); g.beginPath(); g.roundRect(lx, H - 18, tw, 16, 4); g.fill(); g.fillStyle = '#1B1208'; g.fillText(lbl, lx + tw / 2, H - 6);

function pick(ev) {

}
let dragging = false;
$('tl').addEventListener('pointerdown', e => { dragging = true; $('tl').setPointerCapture(e.pointerId); pick(e); });
$('tl').addEventListener('pointermove', e => { if (dragging) pick(e); });
['pointerup', 'pointercancel'].forEach(k => $('tl').addEventListener(k, () => { dragging = false; }));
$('tl').addEventListener('keydown', e => { const st = zoomH <= 24 ? 300000 : zoomH <= 72 ? 900000 : 3600000; if (e.key === 'ArrowLeft') sel -= st; else if (e.key === 'ArrowRight') sel += st; else return; sel = Math.max(tStart, Math.min(tEnd, sel)); drawAll(); e.preventDefault(); });
$('tl').tabIndex = 0;
$('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; zoomH = +b.dataset.z; LS.set('bbt_zoom', zoomH); setRange(); if (sel > tEnd) sel = tEnd; drawAll(); });
$('nowbtn').addEventListener('click', () => { sel = nowLocal(); drawAll(); });

/* ============ Kaart ============ */
const mapGeom = () => { const W = $('map').clientWidth; const kx = (BOX.east - BOX.west) * Math.PI / 180, ky = mercY(BOX.north) - mercY(BOX.south); return {W, H: Math.round(W * ky / kx)}; };
/* Zoom: 1x heel Nederland, 2x of 4x rond je plek (binnen de uitsnede gehouden); VB is de zichtbare uitsnede */
const MAPZ = [1, 2, 4]; let mapZ = LS.get('bbt_mapzoom', 1); if (!MAPZ.includes(mapZ)) mapZ = 1; let VB = BOX;
function viewBox() {
  if (mapZ === 1 || !place) return BOX;
  const w = (BOX.east - BOX.west) / mapZ, yn = mercY(BOX.north), ys = mercY(BOX.south), h = (yn - ys) / mapZ;
  const cx = Math.max(BOX.west + w / 2, Math.min(BOX.east - w / 2, place.lon)), cy = Math.max(ys + h / 2, Math.min(yn - h / 2, mercY(place.lat)));
  return {west: cx - w / 2, east: cx + w / 2, north: unmercY(cy + h / 2), south: unmercY(cy - h / 2)};
}
const px = (lon, W) => (lon - VB.west) / (VB.east - VB.west) * W;
const py = (lat, H) => (mercY(VB.north) - mercY(lat)) / (mercY(VB.north) - mercY(VB.south)) * H;
let modelCanvas = null, modelHour = -1;
function gridAt(lat, lon, hi) {
  let fr = (lat - GRID.lat0) / (GRID.lat1 - GRID.lat0) * (GRID.n - 1), fc = (lon - GRID.lon0) / (GRID.lon1 - GRID.lon0) * (GRID.n - 1);
  fr = Math.max(0, Math.min(GRID.n - 1.0001, fr)); fc = Math.max(0, Math.min(GRID.n - 1.0001, fc));
  const r = Math.floor(fr), c = Math.floor(fc), a = fr - r, b = fc - c, P = grid.p;
  const v = (rr, cc) => P[rr * GRID.n + cc][hi] || 0;
  return lerp(lerp(v(r, c), v(r, c + 1), b), lerp(v(r + 1, c), v(r + 1, c + 1), b), a);
}
function modelLayer(hi, W, H) {
  if (modelCanvas && modelHour === hi && modelCanvas.dataset.w == W && modelCanvas.dataset.z == mapZ) return modelCanvas;
  const sw = Math.max(40, Math.round(W / 4)), sh = Math.max(40, Math.round(H / 4));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh; c.dataset.w = W; c.dataset.z = mapZ; const g = c.getContext('2d'); const im = g.createImageData(sw, sh);
  const cols = [null, col('--rain-1'), col('--rain-2'), col('--rain-3'), col('--rain-4'), col('--rain-5')].map(h => h && [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const y0 = mercY(VB.north), y1 = mercY(VB.south);
  for (let j = 0; j < sh; j++) { const lat = unmercY(y0 - (j + .5) / sh * (y0 - y1)); for (let i = 0; i < sw; i++) {
    const lon = VB.west + (i + .5) / sw * (VB.east - VB.west); const v = gridAt(lat, lon, hi); const lv = mmhLevel(v); if (!lv) continue;
    const k = (j * sw + i) * 4; im.data[k] = cols[lv][0]; im.data[k + 1] = cols[lv][1]; im.data[k + 2] = cols[lv][2]; im.data[k + 3] = Math.round(120 + Math.min(1, v / 5) * 110);
  } }

}
function drawMap() {
  const c = $('map'), dpr = devicePixelRatio || 1, {W, H} = mapGeom();
  VB = viewBox(); $('mzin').disabled = mapZ === MAPZ[MAPZ.length - 1]; $('mzout').disabled = mapZ === 1;
  c.style.height = H + 'px'; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = col('--map-sea'); g.fillRect(0, 0, W, H);
  g.fillStyle = col('--map-land'); g.strokeStyle = col('--map-prov'); g.lineWidth = 1; g.lineJoin = 'round';
  PROVINCIES.forEach(p => p.r.forEach(r => { g.beginPath(); r.forEach((q, k) => k ? g.lineTo(px(q[0], W), py(q[1], H)) : g.moveTo(px(q[0], W), py(q[1], H))); g.closePath(); g.fill(); }));
  PROVINCIES.forEach(p => p.r.forEach(r => { g.beginPath(); r.forEach((q, k) => k ? g.lineTo(px(q[0], W), py(q[1], H)) : g.moveTo(px(q[0], W), py(q[1], H))); g.closePath(); g.stroke(); }));
  const rw = radarWindow(); let lbl = '', sub = '';
  if (rw && sel >= rw.from && sel <= rw.to + 300000) {
    const f = Math.max(0, Math.min(radar.n - 1, Math.round((sel - tzOffset * 1000 - radar.base) / 300000) + HIST));
    const sx = f * RADAR_W + (VB.west - RADAR.west) / (RADAR.east - RADAR.west) * RADAR_W, sw = (VB.east - VB.west) / (RADAR.east - RADAR.west) * RADAR_W;
    const sy = (mercY(RADAR.north) - mercY(VB.north)) / (mercY(RADAR.north) - mercY(RADAR.south)) * RADAR_H, sh = (mercY(VB.north) - mercY(VB.south)) / (mercY(RADAR.north) - mercY(RADAR.south)) * RADAR_H;
    g.globalAlpha = .85; g.drawImage(radar.img, sx, sy, sw, sh, 0, 0, W, H); g.globalAlpha = 1;
    const ft = radar.base + (f - HIST) * 300000 + tzOffset * 1000;

  } else if (grid) {

}

/* ============ Uitlezing en tekst ============ */
function drawReadout() {

  const w = wmo(hv.code, hv.day);

  $('r-src').textContent = inRadar ? t('radar') : t('model'); $('r-src').className = 'src' + (inRadar ? ' radar' : '');
  $('r-ico').textContent = inRadar && b.l ? '🌧️' : w.ico; $('r-temp').textContent = Math.round(hv.temp) + '°';
  $('r-txt').textContent = inRadar && b.l ? t('l')[b.l] : w.txt;
  const kv = [[t('feels'), Math.round(hv.feels) + '°'], [t('rain'), (inRadar ? t('l')[b.l] || '0' : fmt1(b ? b.v : 0)) + (inRadar && b.l ? '' : ' ' + t('mmh'))], [t('chance'), Math.round(hv.prob) + '%'],
    [t('wind'), Math.round(hv.ws) + ' ' + t('kmh') + ' ' + t('dirs_s')[Math.round(hv.wd / 45) % 8]], [t('gust'), Math.round(hv.gust) + ' ' + t('kmh')], [t('cloud'), Math.round(hv.cloud) + '%']];
  $('r-kv').innerHTML = kv.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('');
  /* Tekst */
  const ps = [];
  ps.push(t('moment', {d: relDay(sel)[0].toUpperCase() + relDay(sel).slice(1), t: clock(sel), w: w.txt, temp: Math.round(hv.temp), feels: Math.round(hv.feels), ws: Math.round(hv.ws), dir: windDir(hv.wd), bft: bft(hv.ws), gust: Math.round(hv.gust), cloud: Math.round(hv.cloud)})
    + ' ' + (hv.mm > 0 ? t('rain_some', {mm: fmt1(hv.mm), p: Math.round(hv.prob)}) : t('rain_none')));
  if (inRadar) { const fut = b.t > radar.base + tzOffset * 1000; ps.push(t(b.l ? (fut ? 'radar_exp' : 'radar_wet') : (fut ? 'radar_exp_dry' : 'radar_dry'), {t: clock(b.t), l: t('l')[b.l], p: place.name})); }
  const di = dayAt(sel);
  if (di >= 0) { const d = meteo.daily; ps.push(t('day_sum', {d: dayName(sel)[0].toUpperCase() + dayName(sel).slice(1), min: Math.round(d.temperature_2m_min[di]), max: Math.round(d.temperature_2m_max[di]), mm: fmt1(d.precipitation_sum[di] || 0), w: wmo(d.weather_code[di]).txt, a: clock(parseLocal(d.sunrise[di])), b: clock(parseLocal(d.sunset[di]))})); }
  $('story').innerHTML = ps.map(p => '<p>' + p + '</p>').join('');
}
let raf = 0;
function drawAll() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; if (!$('tlcard').hidden) drawTL(); if (!$('mapcard').hidden) drawMap(); drawReadout(); }); }
/* Welke delen open: eerste keer alles, daarna de keuze uit bbt_tiles */
const SECTIONS = ['now', 'tl', 'map', 'txt', 'ex'], SEC_EL = {now: 'readout', tl: 'tlcard', map: 'mapcard', txt: 'story', ex: 'explain'};
let shown = LS.get('bbt_tiles', SECTIONS).filter(k => SECTIONS.includes(k));
function applySections() {
  SECTIONS.forEach(k => { $(SEC_EL[k]).hidden = !shown.includes(k); });
  $('chips').innerHTML = `<span>${t('show')}</span>` + SECTIONS.map(k => `<button type="button" data-sec="${k}" aria-pressed="${shown.includes(k)}">${t('sec_' + k)}</button>`).join('');
  if (meteo) { modelCanvas = null; drawAll(); }
}
$('menubtn').addEventListener('click', e => { const m = $('menu'); m.hidden = !m.hidden; $('menubtn').setAttribute('aria-expanded', String(!m.hidden)); e.stopPropagation(); });
document.addEventListener('click', e => { if (!$('menu').hidden && !e.target.closest('#menu')) { $('menu').hidden = true; $('menubtn').setAttribute('aria-expanded', 'false'); } });
[['mzin', 1], ['mzout', -1]].forEach(([id, d]) => $(id).addEventListener('click', () => { const i = MAPZ.indexOf(mapZ) + d; if (i < 0 || i >= MAPZ.length) return; mapZ = MAPZ[i]; LS.set('bbt_mapzoom', mapZ); modelCanvas = null; if (meteo) drawAll(); }));
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.sec; shown = shown.includes(k) ? shown.filter(x => x !== k) : SECTIONS.filter(x => shown.includes(x) || x === k); LS.set('bbt_tiles', shown); applySections(); });

/* ============ Start ============ */
function applyText() {
  $('tltitle').textContent = t('title'); $('nowbtn').textContent = t('now'); $('menubtn').title = t('show'); $('refresh').title = t('refresh');
  $('emptytxt').textContent = t('pick_first'); $('emptybtn').textContent = t('open_app'); $('foot').textContent = t('foot');
  document.querySelectorAll('#zoom button').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.z === zoomH)); b.textContent = {3: lang === 'nl' ? '3 u' : '3 h', 12: lang === 'nl' ? '12 u' : '12 h', 24: lang === 'nl' ? '24 u' : '24 h', 72: '3 d', 168: '7 d'}[b.dataset.z]; });
  $('tllegend').innerHTML = `<span><i class="ln"></i>${t('tl_temp')}</span><span><i class="dot"></i>${t('tl_hi')}</span><span><i class="dot lo"></i>${t('tl_lo')}</span><span><i class="ln wind"></i>${t('tl_wind')}</span><span><i class="band"></i>${t('tl_cloud')}</span><span><i class="bar"></i>${t('tl_rain')}</span><span><i class="now"></i>${t('tl_now')}</span>`;
  $('legend').innerHTML = `<span><i style="background:${col('--rain-1')}"></i><i style="background:${col('--rain-3')}"></i><i style="background:${col('--rain-4')}"></i>${t('leg_radar')}</span><span><i style="background:${col('--rain-1')}"></i><i style="background:${col('--rain-2')}"></i><i style="background:${col('--rain-3')}"></i><i style="background:${col('--rain-4')}"></i><i style="background:${col('--rain-5')}"></i>${t('leg_model')}</span><span><i style="background:${col('--accent')};border-radius:999px"></i>${t('leg_place')}</span>`;

applyText();
$('zoom').addEventListener('click', applyText);
$('refresh').addEventListener('click', () => refreshAll(true));
addEventListener('resize', () => { if (meteo) { modelCanvas = null; drawAll(); } });
if (!place) { $('empty').hidden = false; $('placename').textContent = 'Sly Weather'; }
else { $('placename').textContent = place.name; refreshAll(false); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && place) { const c = LS.get('bbt_cache', null); if (!c || Date.now() - c.ts > 10 * 60000) refreshAll(); else { setRange(); drawAll(); } } });
</script>
